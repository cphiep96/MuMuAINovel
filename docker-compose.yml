services:
  postgres:
    image: postgres:18-alpine
    container_name: mumuainovel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mumuai_novel}
      POSTGRES_USER: ${POSTGRES_USER:-mumuai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mumuai} -d ${POSTGRES_DB:-mumuai_novel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai-story-network
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      - -c
      - wal_buffers=${POSTGRES_WAL_BUFFERS:-16MB}
      - -c
      - default_statistics_target=${POSTGRES_DEFAULT_STATISTICS_TARGET:-100}
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-1GB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-4GB}

  mumuainovel:
    # Dùng image build sẵn từ Docker Hub (đã bao gồm embedding model ~400MB)
    # Muốn build từ source: bỏ comment block dưới và tải model vào backend/embedding/ trước
    image: mumujie/mumuainovel:vi
    container_name: mumuainovel
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
      - ./storage/generated_covers:/app/storage/generated_covers
      - ./storage/generated_videos:/app/storage/generated_videos
      - ./.env:/app/.env:ro
    environment:
      # 时区配置
      - TZ=${TZ:-Asia/Shanghai}
      
      # 应用配置
      - APP_NAME=${APP_NAME:-MuMuAINovel}
      - APP_VERSION=${APP_VERSION:-1.5.4}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - APP_PORT=8000
      - DEBUG=${DEBUG:-false}
      
      # 数据库配置
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mumuai}:${POSTGRES_PASSWORD:-123456}@postgres:5432/${POSTGRES_DB:-mumuai_novel}
      
      # 数据库连接信息（用于 entrypoint.sh）
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456}
      
      # PostgreSQL 连接池配置
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-30}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}
      - DATABASE_POOL_TIMEOUT=${DATABASE_POOL_TIMEOUT:-60}
      - DATABASE_POOL_RECYCLE=${DATABASE_POOL_RECYCLE:-1800}
      - DATABASE_POOL_PRE_PING=${DATABASE_POOL_PRE_PING:-True}
      - DATABASE_POOL_USE_LIFO=${DATABASE_POOL_USE_LIFO:-True}
      
      # 全局代理配置（可选）
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
      
      # AI 服务配置
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-openai}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-4o-mini}
      - DEFAULT_TEMPERATURE=${DEFAULT_TEMPERATURE:-0.7}
      - DEFAULT_MAX_TOKENS=${DEFAULT_MAX_TOKENS:-32000}
      - ALLOW_PRIVATE_AI_ENDPOINTS=${ALLOW_PRIVATE_AI_ENDPOINTS:-false}
      - ALLOWED_AI_HOSTS=${ALLOWED_AI_HOSTS:-}
      
      # LinuxDO OAuth 配置
      - LINUXDO_CLIENT_ID=${LINUXDO_CLIENT_ID:-11111}
      - LINUXDO_CLIENT_SECRET=${LINUXDO_CLIENT_SECRET:-11111}
      - LINUXDO_REDIRECT_URI=${LINUXDO_REDIRECT_URI:-http://localhost:8000/api/auth/linuxdo/callback}
      - LINUXDO_PROXY_URL=${LINUXDO_PROXY_URL:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8000}
      
      # 本地账户登录配置
      - LOCAL_AUTH_ENABLED=${LOCAL_AUTH_ENABLED:-true}
      - LOCAL_AUTH_USERNAME=${LOCAL_AUTH_USERNAME:-admin}
      - LOCAL_AUTH_PASSWORD=${LOCAL_AUTH_PASSWORD:-admin123}
      - LOCAL_AUTH_DISPLAY_NAME=${LOCAL_AUTH_DISPLAY_NAME:-本地管理员}
      
      # 会话配置
      - SESSION_EXPIRE_MINUTES=${SESSION_EXPIRE_MINUTES:-120}
      - SESSION_REFRESH_THRESHOLD_MINUTES=${SESSION_REFRESH_THRESHOLD_MINUTES:-30}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}

      # 视频导出配置（FFmpeg 已包含在镜像中；TTS 默认关闭 → video im lặng）
      - VIDEO_EXPORT_ENABLED=${VIDEO_EXPORT_ENABLED:-true}
      - VIDEO_FFMPEG_BINARY=${VIDEO_FFMPEG_BINARY:-}
      - VIDEO_EXPORT_STORAGE_DIR=${VIDEO_EXPORT_STORAGE_DIR:-}
      - VIDEO_MAX_CHAPTERS=${VIDEO_MAX_CHAPTERS:-10}
      - VIDEO_MAX_SCENES=${VIDEO_MAX_SCENES:-40}
      - VIDEO_MAX_DURATION_SECONDS=${VIDEO_MAX_DURATION_SECONDS:-900}
      - VIDEO_MAX_OUTPUT_MB=${VIDEO_MAX_OUTPUT_MB:-512}
      - VIDEO_MAX_ACTIVE_JOBS=${VIDEO_MAX_ACTIVE_JOBS:-2}
      - VIDEO_JOB_TIMEOUT_SECONDS=${VIDEO_JOB_TIMEOUT_SECONDS:-1800}
      - VIDEO_CLAIM_TTL_BUFFER_SECONDS=${VIDEO_CLAIM_TTL_BUFFER_SECONDS:-300}
      - VIDEO_RENDER_TIMEOUT_SECONDS=${VIDEO_RENDER_TIMEOUT_SECONDS:-900}
      - VIDEO_DEFAULT_RESOLUTION=${VIDEO_DEFAULT_RESOLUTION:-1280x720}
      - VIDEO_TTS_ENABLED=${VIDEO_TTS_ENABLED:-false}
      - VIDEO_TTS_BASE_URL=${VIDEO_TTS_BASE_URL:-}
      - VIDEO_TTS_API_KEY=${VIDEO_TTS_API_KEY:-}
      - VIDEO_TTS_MODEL=${VIDEO_TTS_MODEL:-}
      - VIDEO_TTS_VOICE=${VIDEO_TTS_VOICE:-alloy}

      # 视频转场 provider（远端 image-to-video）：默认 local，全部可选
      - VIDEO_MOTION_MODE=${VIDEO_MOTION_MODE:-local}
      - VIDEO_MOTION_PROVIDER=${VIDEO_MOTION_PROVIDER:-}
      - VIDEO_MOTION_MODEL=${VIDEO_MOTION_MODEL:-}
      - VIDEO_MOTION_HYBRID_FALLBACK_ON_ERROR=${VIDEO_MOTION_HYBRID_FALLBACK_ON_ERROR:-true}
      - VIDEO_MOTION_OPERATION_TIMEOUT_SECONDS=${VIDEO_MOTION_OPERATION_TIMEOUT_SECONDS:-900}
      - VIDEO_MOTION_MAX_CLIP_MB=${VIDEO_MOTION_MAX_CLIP_MB:-128}
      - VIDEO_MOTION_DOWNLOAD_ALLOWED_HOSTS=${VIDEO_MOTION_DOWNLOAD_ALLOWED_HOSTS:-}
      - VIDEO_MOTION_ALLOW_INSECURE_LOCALHOST=${VIDEO_MOTION_ALLOW_INSECURE_LOCALHOST:-false}
      - VIDEO_MOTION_XAI_API_KEY=${VIDEO_MOTION_XAI_API_KEY:-}
      - VIDEO_MOTION_XAI_BASE_URL=${VIDEO_MOTION_XAI_BASE_URL:-https://api.x.ai/v1}
      - VIDEO_MOTION_XAI_MODEL=${VIDEO_MOTION_XAI_MODEL:-grok-imagine-video-1.5}
      - VIDEO_MOTION_GEMINI_API_KEY=${VIDEO_MOTION_GEMINI_API_KEY:-}
      - VIDEO_MOTION_GEMINI_MODEL=${VIDEO_MOTION_GEMINI_MODEL:-veo-3.1-generate-preview}
      - VIDEO_MOTION_OPENAI_API_KEY=${VIDEO_MOTION_OPENAI_API_KEY:-}
      - VIDEO_MOTION_OPENAI_BASE_URL=${VIDEO_MOTION_OPENAI_BASE_URL:-}
      - VIDEO_MOTION_OPENAI_MODEL=${VIDEO_MOTION_OPENAI_MODEL:-sora-2}

      # 场景图生成（Meta Muse Image 1.0）：默认关闭 tạo ảnh，key 只从环境/.env 注入
      - VIDEO_IMAGE_ENABLED=${VIDEO_IMAGE_ENABLED:-true}
      - VIDEO_IMAGE_PROVIDER=${VIDEO_IMAGE_PROVIDER:-}
      - VIDEO_IMAGE_MODEL=${VIDEO_IMAGE_MODEL:-}
      - VIDEO_IMAGE_ASPECT_RATIO=${VIDEO_IMAGE_ASPECT_RATIO:-}
      - VIDEO_IMAGE_REASONING_STRENGTH=${VIDEO_IMAGE_REASONING_STRENGTH:-}
      - VIDEO_IMAGE_TIMEOUT_SECONDS=${VIDEO_IMAGE_TIMEOUT_SECONDS:-120}
      - VIDEO_IMAGE_MAX_RETRIES=${VIDEO_IMAGE_MAX_RETRIES:-2}
      - VIDEO_IMAGE_MAX_MB=${VIDEO_IMAGE_MAX_MB:-16}
      - IMAGE_ALLOW_INSECURE_LOCALHOST=${IMAGE_ALLOW_INSECURE_LOCALHOST:-false}
      - META_MUSE_API_KEY=${META_MUSE_API_KEY:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - META_MUSE_BASE_URL=${META_MUSE_BASE_URL:-https://api.meta.ai/v1}
      - META_MUSE_MODEL=${META_MUSE_MODEL:-muse-image-1.0}
      - META_MUSE_OUTPUT_FORMAT=${META_MUSE_OUTPUT_FORMAT:-webp}
      - META_MUSE_REASONING_STRENGTHS=${META_MUSE_REASONING_STRENGTHS:-low,high}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-story-network

volumes:
  postgres_data:
    driver: local

networks:
  ai-story-network:
    driver: bridge

